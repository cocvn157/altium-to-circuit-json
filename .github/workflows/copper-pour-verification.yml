name: Copper pour verification
on:
  push:
    branches: [codex/pour-definition-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Prepare repro and fix
        run: |
          node <<'NODE'
          const fs=require('node:fs');const path=require('node:path');const files={"tests/fixtures/copper-pour-definition.ts":"export const copperPourDefinitionRecords = [\n  \"|RECORD=Board|VX0=0mil|VY0=0mil|VX1=500mil|VY1=0mil|VX2=500mil|VY2=400mil|VX3=0mil|VY3=400mil|VX4=0mil|VY4=0mil\",\n  \"|RECORD=Net|NAME=GND\",\n  \"|RECORD=Rule|RULEKIND=Clearance|ENABLED=TRUE|PRIORITY=1|SCOPE1EXPRESSION=All|SCOPE2EXPRESSION=All|GAP=10mil\",\n  \"|RECORD=Polygon|ID=7|LAYER=TOP|NET=0|VX0=50mil|VY0=50mil|VX1=450mil|VY1=50mil|VX2=450mil|VY2=350mil|VX3=50mil|VY3=350mil|VX4=50mil|VY4=50mil\",\n  \"|RECORD=Region|POLYGON=7|LAYER=TOP|NET=0|REGIONKIND=COPPER|VX0=50mil|VY0=50mil|VX1=200mil|VY1=50mil|VX2=200mil|VY2=350mil|VX3=50mil|VY3=350mil\",\n  \"|RECORD=Region|POLYGON=7|LAYER=TOP|NET=0|REGIONKIND=COPPER|VX0=250mil|VY0=50mil|VX1=450mil|VY1=50mil|VX2=450mil|VY2=350mil|VX3=250mil|VY3=350mil|HOLECOUNT=1|HOLE0COUNT=4|HOLE0VX0=350mil|HOLE0VY0=250mil|HOLE0VX1=400mil|HOLE0VY1=250mil|HOLE0VX2=400mil|HOLE0VY2=300mil|HOLE0VX3=350mil|HOLE0VY3=300mil\",\n  \"|RECORD=Region|POLYGON=7|LAYER=TOP|REGIONKIND=POLYGON_CUTOUT|VX0=350mil|VY0=250mil|VX1=400mil|VY1=250mil|VX2=400mil|VY2=300mil|VX3=350mil|VY3=300mil\",\n]\n","tests/conversion/pcb-copper-pour-definition-repro.test.ts":"import { expect, test } from \"bun:test\"\nimport { parseAltiumPcbDoc } from \"altiumts\"\nimport { convertCircuitJsonToPcbSvg } from \"circuit-to-svg\"\nimport { stackSvgsHorizontally } from \"stack-svgs\"\nimport { convertAltiumPcbDocToCircuitJson } from \"../../lib\"\nimport { copperPourDefinitionRecords } from \"../fixtures/copper-pour-definition\"\ntest(\"shows cached fill gaps that are not part of the authored pour boundary\", async () => {\n  const authoredDocument = parseAltiumPcbDoc(\n    copperPourDefinitionRecords\n      .filter((record) => !record.includes(\"REGIONKIND=COPPER\"))\n      .join(\"\\n\"),\n  )\n  const savedDocument = parseAltiumPcbDoc(\n    copperPourDefinitionRecords.join(\"\\n\"),\n  )\n  const authored = convertAltiumPcbDocToCircuitJson(authoredDocument)\n  const imported = convertAltiumPcbDocToCircuitJson(savedDocument)\n  expect(\n    authored.filter((element) => element.type === \"pcb_copper_pour\"),\n  ).toHaveLength(1)\n  expect(\n    imported.filter((element) => element.type === \"pcb_copper_pour\"),\n  ).toHaveLength(2)\n  const comparison = stackSvgsHorizontally(\n    [authored, imported].map((circuitJson) =>\n      convertCircuitJsonToPcbSvg(circuitJson, {\n        width: 600,\n        height: 480,\n        backgroundColor: \"white\",\n        includeVersion: false,\n        showSolderMask: false,\n      }),\n    ),\n    {\n      gap: 24,\n      normalizeSize: false,\n      rootAttributes: {\n        \"aria-label\":\n          \"Authored pour boundary on left; imported cached copper with an obsolete routing gap on right\",\n      },\n    },\n  )\n  await expect(comparison).toMatchSvgSnapshot(import.meta.path)\n})\n","tests/conversion/pcb-copper-pour-recompute.test.ts":"import { expect, test } from \"bun:test\"\nimport { parseAltiumPcbDoc } from \"altiumts\"\nimport { convertCircuitJsonToPcbSvg } from \"circuit-to-svg\"\nimport { stackSvgsHorizontally } from \"stack-svgs\"\nimport { convertAltiumPcbDocToCircuitJson } from \"../../lib\"\nimport { copperPourDefinitionRecords } from \"../fixtures/copper-pour-definition\"\nimport { hasCopperAt } from \"../helpers/hasCopperAt\"\ntest(\"imports authored pour definitions and global clearance for recomputation\", async () => {\n  const document = parseAltiumPcbDoc(copperPourDefinitionRecords.join(\"\\n\"))\n  const preserved = convertAltiumPcbDocToCircuitJson(document)\n  expect(\n    convertAltiumPcbDocToCircuitJson(document, { copperPourMode: \"preserve\" }),\n  ).toEqual(preserved)\n  const recomputed = convertAltiumPcbDocToCircuitJson(document, {\n    copperPourMode: \"recompute\",\n  })\n  const pours = recomputed.filter(\n    (element) => element.type === \"pcb_copper_pour\",\n  )\n  expect(pours).toHaveLength(1)\n  expect(pours[0]).toMatchObject({\n    pcb_copper_pour_id: \"pcb_copper_pour_altium_polygon_0\",\n    source_net_id: expect.any(String),\n    layer: \"top\",\n    shape: \"brep\",\n  })\n  expect(hasCopperAt(pours, { x: 5.715, y: 3.81 })).toBe(true)\n  expect(hasCopperAt(pours, { x: 9.525, y: 6.985 })).toBe(false)\n  expect(\n    recomputed.find((element) => element.type === \"pcb_board\"),\n  ).toMatchObject({\n    min_trace_to_pad_edge_clearance: 0.254,\n    min_different_net_trace_edge_to_trace_edge_clearance: 0.254,\n    min_pad_edge_to_pad_edge_clearance: 0.254,\n    min_via_edge_to_pad_edge_clearance: 0.254,\n  })\n  expect(\n    recomputed.find((element) => element.type === \"source_net\"),\n  ).toMatchObject({ source_net_id: pours[0]?.source_net_id, name: \"GND\" })\n  expect(\n    convertAltiumPcbDocToCircuitJson(document, {\n      copperPourMode: \"recompute\",\n      includeCopperAreas: false,\n    }).some((element) => element.type === \"pcb_copper_pour\"),\n  ).toBe(false)\n  for (const replacement of [\"\", \"|SCOPE1EXPRESSION=InNet('HV')\"]) {\n    const records = replacement\n      ? copperPourDefinitionRecords.map((record) =>\n          record.replace(\"|SCOPE1EXPRESSION=All\", replacement),\n        )\n      : copperPourDefinitionRecords.filter(\n          (record) => !record.includes(\"RULEKIND=Clearance\"),\n        )\n    expect(() =>\n      convertAltiumPcbDocToCircuitJson(parseAltiumPcbDoc(records.join(\"\\n\")), {\n        copperPourMode: \"recompute\",\n      }),\n    ).toThrow(/clearance rule/)\n  }\n  const comparison = stackSvgsHorizontally(\n    [preserved, recomputed].map((circuitJson) =>\n      convertCircuitJsonToPcbSvg(circuitJson, {\n        width: 600,\n        height: 480,\n        backgroundColor: \"white\",\n        includeVersion: false,\n        showSolderMask: false,\n      }),\n    ),\n    { gap: 24, normalizeSize: false },\n  )\n  await expect(comparison).toMatchSvgSnapshot(import.meta.path)\n})\n","lib/pcb/routing/getCopperPourClearanceConstraints.ts":"import type { AltiumPcbDocument } from \"altiumts\"\nimport { milsToMillimeters } from \"../geometry\"\nimport type { PcbRoutingConstraints } from \"../model\"\nimport { getHighestPriorityGlobalRule } from \"./getHighestPriorityGlobalRule\"\nimport { isAllScope } from \"./isAllScope\"\nexport function getCopperPourClearanceConstraints(\n  document: AltiumPcbDocument,\n): PcbRoutingConstraints[\"pcbBoard\"] {\n  const hasScopedClearance = document.rules.some(\n    (rule) =>\n      rule.enabled !== false &&\n      rule.ruleKind?.toUpperCase() === \"CLEARANCE\" &&\n      (!isAllScope(rule.scope1Expression) ||\n        !isAllScope(rule.scope2Expression)),\n  )\n  if (hasScopedClearance)\n    throw new Error(\n      \"Copper pour recomputation does not support scoped Altium clearance rules\",\n    )\n  const clearanceMils = getHighestPriorityGlobalRule({\n    document,\n    ruleKind: \"Clearance\",\n  })?.clearanceMils\n  if (clearanceMils === undefined)\n    throw new Error(\n      \"Copper pour recomputation requires a global Altium clearance rule\",\n    )\n  if (!Number.isFinite(clearanceMils) || clearanceMils < 0)\n    throw new Error(\n      \"Altium copper pour clearance must be finite and nonnegative\",\n    )\n  const boardEdgeClearanceMils = getHighestPriorityGlobalRule({\n    document,\n    ruleKind: \"BoardOutlineClearance\",\n  })?.clearanceMils\n  if (\n    boardEdgeClearanceMils !== undefined &&\n    (!Number.isFinite(boardEdgeClearanceMils) || boardEdgeClearanceMils < 0)\n  ) {\n    throw new Error(\"Altium board edge clearance must be finite and nonnegative\")\n  }\n  const clearanceMillimeters = milsToMillimeters(clearanceMils)\n  return {\n    ...(boardEdgeClearanceMils === undefined\n      ? {}\n      : {\n          min_board_edge_clearance: milsToMillimeters(boardEdgeClearanceMils),\n        }),\n    min_trace_to_pad_edge_clearance: clearanceMillimeters,\n    min_different_net_trace_edge_to_trace_edge_clearance: clearanceMillimeters,\n    min_pad_edge_to_pad_edge_clearance: clearanceMillimeters,\n    min_via_edge_to_pad_edge_clearance: clearanceMillimeters,\n  }\n}\n","lib/pcb/model/types.ts":"import type {\n  AltiumEmbeddedModel,\n  AltiumPadRecord,\n  AltiumPcbDocument,\n  AltiumPrjPcb,\n  AltiumRecord,\n} from \"altiumts\"\nimport type {\n  AnyCircuitElement,\n  PcbBoard,\n  SourceNet,\n  SourcePort,\n  SourceSimpleChip,\n  SourceTrace,\n} from \"circuit-json\"\nimport type { PcbCopperLayerMap } from \"../layers\"\n\nexport interface EmbeddedModelUrlContext {\n  embeddedModel: AltiumEmbeddedModel\n}\n\nexport interface ConvertAltiumPcbDocOptions {\n  idPrefix?: string\n  includeBoardOutline?: boolean\n  includeCadModels?: boolean\n  includeComponents?: boolean\n  includeCopperAreas?: boolean\n  /** Import polygon definitions for repouring in core; this converter does not run a pour solver. */\n  copperPourMode?: \"preserve\" | \"recompute\"\n  includeCourtyards?: boolean\n  includeDimensions?: boolean\n  includeKeepouts?: boolean\n  includePads?: boolean\n  includeSilkscreen?: boolean\n  includeTraces?: boolean\n  includeVias?: boolean\n  resolveEmbeddedModelUrl?: (\n    context: EmbeddedModelUrlContext,\n  ) => string | undefined\n  project?: AltiumPrjPcb\n}\n\nexport interface PcbNetContext {\n  elements: Array<SourceNet | SourceTrace>\n  getSourceNetId: (record: AltiumRecord) => string | undefined\n  getSourceTraceId: (record: AltiumRecord) => string | undefined\n}\n\nexport interface PcbComponentContext {\n  sourceComponents: SourceSimpleChip[]\n  sourcePorts: SourcePort[]\n  getPcbComponentId: (record: AltiumRecord) => string | undefined\n  getSourcePortId: (record: AltiumPadRecord) => string | undefined\n}\n\nexport interface PcbRoutingConstraints {\n  pcbBoard: Pick<\n    PcbBoard,\n    | \"allow_blind_and_buried_vias\"\n    | \"is_via_in_pad_allowed\"\n    | \"min_trace_width\"\n    | \"min_board_edge_clearance\"\n    | \"min_trace_to_pad_edge_clearance\"\n    | \"min_different_net_trace_edge_to_trace_edge_clearance\"\n    | \"min_pad_edge_to_pad_edge_clearance\"\n    | \"min_via_edge_to_pad_edge_clearance\"\n    | \"min_via_hole_diameter\"\n    | \"min_via_pad_diameter\"\n  >\n  sourceNetTraceWidthMillimeters?: number\n}\n\nexport interface PcbConversionContext {\n  componentContext: PcbComponentContext\n  document: AltiumPcbDocument\n  elements: AnyCircuitElement[]\n  layerMap: PcbCopperLayerMap\n  netContext: PcbNetContext\n  options: ConvertAltiumPcbDocOptions\n  routingConstraints: PcbRoutingConstraints\n}\n","lib/pcb/copperAreas/convertAltiumCopperAreas.ts":"import {\n  AltiumFillRecord,\n  type AltiumPcbDocument,\n  AltiumPolygonRecord,\n  type AltiumRecord,\n  AltiumRegionRecord,\n  getPcbContour,\n  getPcbRecordPolygonIndex,\n  getPcbRegionGeometry,\n} from \"altiumts\"\nimport type { PcbCopperPour } from \"circuit-json\"\nimport { PcbCopperLayerMap } from \"../layers\"\nimport { convertCopperFill } from \"./convertCopperFill\"\nimport { convertCopperPolygon } from \"./convertCopperPolygon\"\nimport { convertCopperRegion } from \"./convertCopperRegion\"\nimport { isContourInsideContour } from \"./isContourInsideContour\"\n\nexport function convertAltiumCopperAreas(\n  document: AltiumPcbDocument,\n  {\n    layerMap = new PcbCopperLayerMap(document),\n    getSourceNetId = () => undefined,\n    copperPourMode = \"preserve\",\n  }: {\n    layerMap?: PcbCopperLayerMap\n    copperPourMode?: \"preserve\" | \"recompute\"\n    getSourceNetId?: (record: AltiumRecord) => string | undefined\n  } = {},\n): PcbCopperPour[] {\n  const polygonsWithCopperRegions = new Set<AltiumPolygonRecord>()\n  const cutoutsByPolygon = new Map<AltiumPolygonRecord, AltiumRegionRecord[]>()\n  const polygonContours = new Map<\n    AltiumPolygonRecord,\n    ReturnType<typeof getPcbContour>\n  >()\n  for (const record of document.records) {\n    if (\n      !(record instanceof AltiumRegionRecord) ||\n      record.recordKind !== \"Region\"\n    ) {\n      continue\n    }\n    const polygonIndex = getPcbRecordPolygonIndex(document, record)\n    const linkedPolygon = document.getPolygonForRecord(record)\n    if (record.regionKind === \"COPPER\") {\n      if (record.getBoolean(\"KEEPOUT\") === true) continue\n      if (linkedPolygon) polygonsWithCopperRegions.add(linkedPolygon)\n    } else if (record.regionKind === \"POLYGON_CUTOUT\") {\n      const cutoutGeometry = getPcbRegionGeometry(record)\n      const candidatePolygons =\n        polygonIndex === undefined\n          ? document.polygons\n          : linkedPolygon\n            ? [linkedPolygon]\n            : []\n      const polygons = candidatePolygons.filter((polygon) => {\n        if (record.layer !== polygon.layer && record.layer !== \"MULTILAYER\") {\n          return false\n        }\n        let polygonContour = polygonContours.get(polygon)\n        if (!polygonContour) {\n          polygonContour = getPcbContour(polygon)\n          polygonContours.set(polygon, polygonContour)\n        }\n        return isContourInsideContour({\n          innerContour: cutoutGeometry.outline,\n          outerContour: polygonContour,\n        })\n      })\n      for (const polygon of polygons) {\n        const cutouts = cutoutsByPolygon.get(polygon) ?? []\n        cutouts.push(record)\n        cutoutsByPolygon.set(polygon, cutouts)\n      }\n    }\n  }\n  const polygonIndexes = new Map(\n    document.polygons.map((polygon, index) => [polygon, index]),\n  )\n\n  return document.records.flatMap((record, recordIndex) => {\n    if (record.getBoolean(\"KEEPOUT\") === true) return []\n    if (\n      copperPourMode === \"recompute\" &&\n      (record instanceof AltiumRegionRecord || record instanceof AltiumFillRecord) &&\n      document.getPolygonForRecord(record)\n    ) {\n      return []\n    }\n    if (record instanceof AltiumRegionRecord) {\n      return convertCopperRegion({\n        layerMap,\n        record,\n        recordIndex,\n        sourceNetId: getSourceNetId(record),\n      })\n    }\n    if (record instanceof AltiumPolygonRecord) {\n      const polygonIndex = polygonIndexes.get(record)\n      if (\n        record.shelved === true ||\n        polygonIndex === undefined ||\n        (copperPourMode === \"preserve\" && polygonsWithCopperRegions.has(record))\n      ) {\n        return []\n      }\n      return convertCopperPolygon({\n        cutouts: cutoutsByPolygon.get(record) ?? [],\n        layerMap,\n        polygonIndex,\n        record,\n        sourceNetId: getSourceNetId(record),\n      })\n    }\n    if (record instanceof AltiumFillRecord) {\n      return convertCopperFill({\n        layerMap,\n        record,\n        recordIndex,\n        sourceNetId: getSourceNetId(record),\n      })\n    }\n    return []\n  })\n}\n","lib/pcb/copperAreas/convertPcbCopperAreas.ts":"import type { PcbConversionContext } from \"../model\"\nimport { convertAltiumCopperAreas } from \"./convertAltiumCopperAreas\"\n\nexport function convertPcbCopperAreas(context: PcbConversionContext): void {\n  if (context.options.includeCopperAreas === false) return\n  context.elements.push(\n    ...convertAltiumCopperAreas(context.document, {\n      layerMap: context.layerMap,\n      copperPourMode: context.options.copperPourMode,\n      getSourceNetId: context.netContext.getSourceNetId,\n    }),\n  )\n}\n","lib/pcb/context/createPcbConversionContext.ts":"import type { AltiumPcbDocument } from \"altiumts\"\nimport { PcbCopperLayerMap } from \"../layers\"\nimport type { ConvertAltiumPcbDocOptions, PcbConversionContext } from \"../model\"\nimport { getPcbRoutingConstraints } from \"../routing/getPcbRoutingConstraints\"\nimport { createPcbComponentContext } from \"./createPcbComponentContext\"\nimport { createPcbNetContext } from \"./createPcbNetContext\"\n\nexport function createPcbConversionContext({\n  document,\n  options,\n}: {\n  document: AltiumPcbDocument\n  options: ConvertAltiumPcbDocOptions\n}): PcbConversionContext {\n  const layerMap = new PcbCopperLayerMap(document)\n  const componentContext = createPcbComponentContext({\n    document,\n    includePorts: options.includePads !== false,\n    layerMap,\n  })\n  const routingConstraints = getPcbRoutingConstraints({\n    document,\n    layerMap,\n    copperPourMode:\n      options.includeCopperAreas === false\n        ? \"preserve\"\n        : options.copperPourMode,\n  })\n  return {\n    componentContext,\n    document,\n    elements: [],\n    layerMap,\n    netContext: createPcbNetContext({\n      componentContext,\n      document,\n      sourceNetTraceWidthMillimeters:\n        routingConstraints.sourceNetTraceWidthMillimeters,\n    }),\n    options,\n    routingConstraints,\n  }\n}\n","lib/pcb/routing/getPcbRoutingConstraints.ts":"import { type AltiumPcbDocument, AltiumViaRecord } from \"altiumts\"\nimport { milsToMillimeters } from \"../geometry\"\nimport type { PcbCopperLayerMap } from \"../layers\"\nimport type { PcbRoutingConstraints } from \"../model\"\nimport { getHighestPriorityGlobalRule } from \"./getHighestPriorityGlobalRule\"\nimport { getCopperPourClearanceConstraints } from \"./getCopperPourClearanceConstraints\"\nimport { usesViaInPad } from \"./usesViaInPad\"\n\nexport function getPcbRoutingConstraints({\n  document,\n  layerMap,\n  copperPourMode,\n}: {\n  document: AltiumPcbDocument\n  layerMap: PcbCopperLayerMap\n  copperPourMode?: \"preserve\" | \"recompute\"\n}): PcbRoutingConstraints {\n  const widthRule = getHighestPriorityGlobalRule({\n    document,\n    ruleKind: \"Width\",\n  })\n  const routingViasRule = getHighestPriorityGlobalRule({\n    document,\n    ruleKind: \"RoutingVias\",\n  })\n  const minimumTraceWidthMils = widthRule?.widthConstraint?.minimumMils\n  const preferredTraceWidthMils = widthRule?.widthConstraint?.preferredMils\n  const minimumViaHoleDiameterMils =\n    routingViasRule?.viaHoleConstraint?.minimumMils\n  const minimumViaPadDiameterMils =\n    routingViasRule?.viaDiameterConstraint?.minimumMils\n  const pcbBoard: PcbRoutingConstraints[\"pcbBoard\"] =\n    copperPourMode === \"recompute\" && document.polygons.length > 0\n      ? getCopperPourClearanceConstraints(document)\n      : {}\n  const routingConstraints: PcbRoutingConstraints = { pcbBoard }\n\n  const hasBlindOrBuriedVia = document.records.some(\n    (record) =>\n      record instanceof AltiumViaRecord && record.kind === \"blind-buried\",\n  )\n  if (hasBlindOrBuriedVia) {\n    pcbBoard.allow_blind_and_buried_vias = true\n  }\n\n  if (usesViaInPad({ document, layerMap })) {\n    pcbBoard.is_via_in_pad_allowed = true\n  }\n\n  if (minimumTraceWidthMils !== undefined) {\n    pcbBoard.min_trace_width = milsToMillimeters(minimumTraceWidthMils)\n  }\n\n  if (minimumViaHoleDiameterMils !== undefined) {\n    pcbBoard.min_via_hole_diameter = milsToMillimeters(\n      minimumViaHoleDiameterMils,\n    )\n  }\n\n  if (minimumViaPadDiameterMils !== undefined) {\n    pcbBoard.min_via_pad_diameter = milsToMillimeters(minimumViaPadDiameterMils)\n  }\n\n  if (preferredTraceWidthMils !== undefined) {\n    routingConstraints.sourceNetTraceWidthMillimeters = milsToMillimeters(\n      preferredTraceWidthMils,\n    )\n  }\n\n  return routingConstraints\n}\n","tests/conversion/pcb-recompute-standalone-copper.test.ts":"import { expect, test } from \"bun:test\"\nimport { parseAltiumPcbDoc } from \"altiumts\"\nimport { convertAltiumPcbDocToCircuitJson } from \"../../lib\"\nimport { copperPourDefinitionRecords } from \"../fixtures/copper-pour-definition\"\n\ntest.each([\"\", \"|POLYGON=65535\", \"|POLYGON=-1\", \"|POLYGON=42\"])(\n  \"keeps standalone copper while removing cached polygon copper: %s\",\n  (reference) => {\n    const document = parseAltiumPcbDoc(\n      [\n        ...copperPourDefinitionRecords,\n        `|RECORD=Region${reference}|LAYER=BOTTOM|NET=0|REGIONKIND=COPPER|VX0=50mil|VY0=50mil|VX1=150mil|VY1=50mil|VX2=150mil|VY2=150mil|VX3=50mil|VY3=150mil`,\n        `|RECORD=Fill${reference}|LAYER=BOTTOM|NET=0|X1=200mil|Y1=50mil|X2=300mil|Y2=150mil|ROTATION=15`,\n        \"|RECORD=Fill|POLYGON=7|LAYER=TOP|NET=0|X1=50mil|Y1=50mil|X2=100mil|Y2=100mil\",\n      ].join(\"\\n\"),\n    )\n    const preserved = convertAltiumPcbDocToCircuitJson(document)\n    const definitions = convertAltiumPcbDocToCircuitJson(document, {\n      copperPourMode: \"recompute\",\n    })\n    const standalone = preserved.filter(\n      (element) => element.type === \"pcb_copper_pour\" && element.layer === \"bottom\",\n    )\n    expect(standalone).toHaveLength(2)\n    expect(definitions.filter((element) => element.type === \"pcb_copper_pour\")).toEqual([\n      expect.objectContaining({\n        pcb_copper_pour_id: \"pcb_copper_pour_altium_polygon_0\",\n        layer: \"top\",\n      }),\n      ...standalone,\n    ])\n    expect(standalone).toEqual([\n      expect.objectContaining({ shape: \"polygon\", source_net_id: expect.any(String) }),\n      expect.objectContaining({ shape: \"rect\", rotation: 15, source_net_id: expect.any(String) }),\n    ])\n  },\n)\n","README.md":"# altium-to-circuit-json\n\nConvert Altium schematic and PCB documents into [Circuit JSON](https://github.com/tscircuit/circuit-json).\n\nThe converter is built on [altiumts](https://github.com/tscircuit/altiumts). Its visual tests render the original document with `altiumts` on the left and the converted Circuit JSON with `circuit-to-svg` on the right, then combine the panels with `stack-svgs` and verify them with `bun-match-svg`.\n\n## Install\n\n```sh\nbun add altium-to-circuit-json\n```\n\n## Usage\n\nAutomatic format detection accepts text, `Uint8Array`, or `ArrayBuffer` input:\n\n```ts\nimport { readFile } from \"node:fs/promises\"\nimport { convertAltiumToCircuitJson } from \"altium-to-circuit-json\"\n\nconst bytes = await readFile(\"motor-controller.PcbDoc\")\nconst circuitJson = convertAltiumToCircuitJson(bytes)\n```\n\nParsed `altiumts` documents can be converted directly:\n\n```ts\nimport { parseAltiumSchDoc } from \"altiumts\"\nimport { convertAltiumSchDocToCircuitJson } from \"altium-to-circuit-json\"\n\nconst document = parseAltiumSchDoc(schematicBytes)\nconst circuitJson = convertAltiumSchDocToCircuitJson(document)\n```\n\nConvert a PCB and its schematic sheets together when they belong to one\nproject. The project converter gives every document its own ID scope, then\nreconciles components, pins, named nets, and traces into shared source\nidentities:\n\n```ts\nconst circuitJson = convertAltiumProjectToCircuitJson({\n  pcb: { document: pcbDocument },\n  schematics: [\n    { document: powerSchematic },\n    { document: controllerSchematic },\n  ],\n})\n```\n\nFor custom document assembly, the individual document converters also accept a\nstable `idPrefix` that is applied to every Circuit JSON ID and reference.\n\nThe public conversion functions are:\n\n- `convertAltiumToCircuitJson(source, options)` for automatic parsing and conversion.\n- `convertAltiumDocumentToCircuitJson(document, options)` for an already parsed document.\n- `convertAltiumPcbDocToCircuitJson(document, options)` for PCB documents.\n- `convertAltiumProjectToCircuitJson(input)` for a PCB and its schematic sheets.\n- `convertAltiumSchDocToCircuitJson(document, options)` for schematic documents.\n\nFor callers that need progress visibility, debugging, or custom orchestration,\nthe same conversion is exposed as a staged converter:\n\n```ts\nimport { AltiumToCircuitJsonConverter } from \"altium-to-circuit-json\"\n\nconst converter = new AltiumToCircuitJsonConverter(bytes)\nwhile (!converter.finished) {\n  console.log(converter.currentStage?.constructor.name)\n  converter.step()\n}\nconst circuitJson = converter.getOutput()\n```\n\nEach stage has the standard converter contract: `step()`,\n`runUntilFinished()`, `finished`, and `getOutput()`. The parser boundary stays\nin `altiumts`; conversion stages consume typed Altium documents and records.\n\n## Copper pour definitions\n\nBy default, PCB conversion preserves saved copper geometry. To prepare a board\nfor fresh routing and pouring, use:\n\n```ts\nconst circuitJson = convertAltiumPcbDocToCircuitJson(pcbDocument, {\n  copperPourMode: \"recompute\",\n  includeTraces: false,\n  includeVias: false,\n})\n```\n\nThis imports the authored polygon boundaries, cutouts, nets, layers, and global\nclearances. Only saved fills and regions linked to a polygon are discarded;\nstandalone authored copper is retained. Missing or scoped clearance rules are\nrejected. Custom thermals and pour priority are not mapped.\n\nThis converter does not route traces or run a copper pour solver. Its output and\nSVG show input definitions, not a finished or clearance-verified pour. To compute\nnew copper, convert the definitions to TSX with\n`convertCircuitJsonToTscircuit(circuitJson, { componentName: \"ImportedBoard\", copperPourMode: \"recompute\" })`\nfrom `circuit-json-to-tscircuit`, then render that TSX through core. Core performs\nthe routing and copper pour computation.\n\n## Current coverage\n\nPCB conversion currently emits:\n\n- polygon board outlines and board cutouts;\n- PCB component placement bounds;\n- top, bottom, and inner-layer copper tracks;\n- vias;\n- circular, rectangular, rounded, octagonal, rotated, pill, slotted, plated, and non-plated pads/holes;\n- top and bottom silkscreen lines, arcs, fills, and text; and\n- Altium mil coordinates converted to millimeters.\n\nCopper layers follow the board's physical stack order, including interleaved\nsignal and plane layers. Layer IDs and custom stack names resolve to the same\nCircuit JSON layer. The current schema supports up to ten copper layers\n(`top`, `inner1`–`inner8`, `bottom`). Conversion throws for larger or ambiguous\nstacks and for copper layers absent from the stack. Documents without stack\ninformation support outer-layer copper only.\n\nSchematic conversion currently emits:\n\n- a Circuit JSON `schematic_sheet`, with imported geometry page-fitted and\n  centered inside its standard A4 drawing area;\n- typed source components, source ports, source nets, and source traces;\n- standard Circuit JSON resistor, capacitor, inductor, diode, LED, test-point,\n  power, and ground symbols;\n- box-with-pins schematic components with named and numbered schematic ports\n  for chips, connectors, and other multi-pin parts;\n- wires as schematic traces, including mid-segment labels, pin terminals,\n  T-junctions, and explicit junctions;\n- polylines, polygons, rectangles, circles, ellipses, and arcs;\n- no-ERC markers, hierarchical ports, and power ports;\n- labels, net labels, designators, parameters, and text frames; and\n- active multipart/display-mode filtering, with multiple placed symbol parts\n  sharing one physical source component.\n\nBy default, schematic coordinates are scaled from the Altium page dimensions\nand centered on the emitted `schematic_sheet`. Set `schematicUnitScale` to use\nan explicit coordinate scale, or `centerOnSchematicSheet: false` to preserve an\nAltium-style origin. The old plain rectangular page outline remains available\nas an opt-in compatibility overlay with `includeSheetBorder: true`.\n\nThe package is intentionally an incremental converter. Complete component\nclassification, copper pours/regions, mechanical/dimension primitives, models,\nand project-level hierarchy remain follow-up areas.\n\n## Visual tests\n\nDownload the checksum-pinned upstream reference files and run the tests:\n\n```sh\nbun run test\n```\n\nUpdate the SVG snapshots after an intentional visual change:\n\n```sh\nbun run test:update-svg\n```\n\nEvery imported reference used by the test suite has a side-by-side SVG snapshot. The committed fixtures are generated from pinned upstream URLs and are not stored in this repository.\n\nThe real-world PCB corpus covers NodeMCU ESP-12, EBAZ4205, HERON Payload SSM,\nSimpleFOC Mini, and SimpleFOC Shield V3. The schematic corpus covers NodeMCU,\nHERON PAY-SSM and Systems PCB, SimpleFOC Mini, and SimpleFOC Shield V3.\n\nThe TI power-reference PCB corpus covers PMP23595, the PMP23653 main and planar\ntransformer boards, and the PMP22650 package's PMP22650, PMP22712, and PMP22773\nboards. Each is downloaded directly from its checksum-pinned TI CAD/CAE archive\nand has an Altium-to-Circuit-JSON side-by-side SVG repro.\n\nThe TI EVM corpus covers DRV8307EVM, LM5155EVM-FLY, LM251772EVM-PD, and\nLMG342X-BB-EVM. Their checksum-pinned PCB, electrical schematic, and hardware\ndrawing documents each have an Altium-to-Circuit-JSON side-by-side SVG repro.\nSK-AM62A-LP is not included in this corpus because TI publishes its source as an\nAllegro ASCII board and OrCAD schematic rather than Altium `PcbDoc`/`SchDoc`\ndocuments.\n\nThe TI SPRCAL9 / TMDS62LEVM Rev. B regression corpus includes all 57\nschematic sheets and a full top-side PCB comparison. Its large downloaded source\nfiles are checksum-verified and cached in CI. To also write the complete\nconverted Circuit JSON artifacts locally, run:\n\n```sh\nbun run convert:ti-reference\n```\n\nThis creates `artifacts/ti-tmds62levm-rev-b/pcb.circuit.json`, one Circuit JSON\nfile per schematic sheet, and a conversion manifest. The artifact directory is\ngitignored; the compact SVG regression snapshots remain committed.\n\n## Development\n\n```sh\nbun install\nbun run typecheck\nbun run format:check\nbun run build\n```\n"};for(const [name,content]of Object.entries(files)){fs.mkdirSync(path.dirname(name),{recursive:true});fs.writeFileSync(name,content)}
          NODE
      - name: Match repository formatting
        run: bunx biome format --write tests/fixtures/copper-pour-definition.ts tests/conversion/pcb-copper-pour-definition-repro.test.ts tests/conversion/pcb-copper-pour-recompute.test.ts lib/pcb/routing/getCopperPourClearanceConstraints.ts lib/pcb/model/types.ts lib/pcb/copperAreas/convertAltiumCopperAreas.ts lib/pcb/copperAreas/convertPcbCopperAreas.ts lib/pcb/context/createPcbConversionContext.ts lib/pcb/routing/getPcbRoutingConstraints.ts
      - run: bun run download-references
      - name: Inspect native TI boards
        run: |
          cat <<'STATS' > pour-native-stats.ts
          import { parseAltiumBinaryPcbDoc,AltiumFillRecord,AltiumRegionRecord } from "altiumts";import { convertAltiumPcbDocToCircuitJson } from "./lib";import { convertAltiumCopperAreas } from "./lib/pcb/copperAreas/convertAltiumCopperAreas";for(const name of ["ti-pmp22712.PcbDoc","ti-pmp22773.PcbDoc","ti-pmp23595.PcbDoc","ti-pmp22650-main.PcbDoc"]){const d=parseAltiumBinaryPcbDoc(new Uint8Array(await Bun.file("tests/fixtures/downloaded/"+name).arrayBuffer()));const standalone=d.records.filter(r=>(r instanceof AltiumFillRecord||r instanceof AltiumRegionRecord&&r.regionKind==="COPPER")&&r.getBoolean("KEEPOUT")!==true&&!d.getPolygonForRecord(r));const cached=d.records.filter(r=>(r instanceof AltiumFillRecord||r instanceof AltiumRegionRecord&&r.regionKind==="COPPER")&&!!d.getPolygonForRecord(r));const saved=convertAltiumCopperAreas(d);const definitions=convertAltiumCopperAreas(d,{copperPourMode:"recompute"});console.log("COPPER_STAGE_STATS "+JSON.stringify({name,saved:saved.length,definitions:definitions.length,savedStandalone:saved.filter(e=>!e.pcb_copper_pour_id.includes("_polygon_")&&!d.getPolygonForRecord(d.records[Number(e.pcb_copper_pour_id.split("_").at(-1))])).map(e=>({id:e.pcb_copper_pour_id,shape:e.shape,layer:e.layer})),definitionKinds:Object.fromEntries(["polygon","region","fill"].map(kind=>[kind,definitions.filter(e=>e.pcb_copper_pour_id.includes("_"+kind+"_")).length]))}));let result;try{const c=convertAltiumPcbDocToCircuitJson(d,{copperPourMode:"recompute"});result={pours:c.filter(e=>e.type==="pcb_copper_pour").length,standalone:c.filter(e=>e.type==="pcb_copper_pour"&&!e.pcb_copper_pour_id.includes("_polygon_")).map(e=>({id:e.pcb_copper_pour_id,shape:e.shape,layer:e.layer})),board:c.find(e=>e.type==="pcb_board")}}catch(e){result={error:String(e)}}console.log("REAL_BOARD_STATS "+JSON.stringify({name,polygons:d.polygons.length,standalone:standalone.length,cached:cached.length,result}))}
          STATS
          bun run pour-native-stats.ts
          rm pour-native-stats.ts
      - name: Generate repro and fix snapshots
        run: BUN_UPDATE_SNAPSHOTS=1 bun test tests/conversion/pcb-copper-pour-definition-repro.test.ts tests/conversion/pcb-copper-pour-recompute.test.ts --timeout 9999999
      - name: Verify existing copper imports and handbook
        run: bun test tests/conversion/pcb-copper-areas.test.ts tests/conversion/pcb-polygon-cutout.test.ts tests/conversion/pcb-polygon-deduplication.test.ts tests/conversion/pcb-keepout-regions-not-copper.test.ts tests/architecture/handbookCompliance.test.ts tests/conversion/pcb-recompute-standalone-copper.test.ts --timeout 9999999
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Return source and generated SVGs
        if: always()
        run: |
          node <<'NODE'
          const fs=require('node:fs');const {Resvg}=require('@resvg/resvg-js');const names=["tests/fixtures/copper-pour-definition.ts","tests/conversion/pcb-copper-pour-definition-repro.test.ts","tests/conversion/__snapshots__/pcb-copper-pour-definition-repro.snap.svg","lib/pcb/model/types.ts","lib/pcb/copperAreas/convertAltiumCopperAreas.ts","lib/pcb/copperAreas/convertPcbCopperAreas.ts","lib/pcb/context/createPcbConversionContext.ts","lib/pcb/routing/getPcbRoutingConstraints.ts","lib/pcb/routing/getCopperPourClearanceConstraints.ts","tests/conversion/pcb-copper-pour-recompute.test.ts","tests/conversion/__snapshots__/pcb-copper-pour-recompute.snap.svg"];for(const name of names){if(fs.existsSync(name)){console.log('POUR_ARTIFACT '+name+' '+fs.readFileSync(name).toString('base64'));if(name.endsWith('.svg'))console.log('POUR_PREVIEW '+name+' '+new Resvg(fs.readFileSync(name,'utf8'),{fitTo:{mode:'width',value:1600}}).render().asPng().toString('base64'))}}

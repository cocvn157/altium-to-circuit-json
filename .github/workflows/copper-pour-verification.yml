name: Copper pour verification
on:
  push:
    branches: [codex/pour-definition-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Prepare repro and fix
        run: |
          node <<'NODE'
          const fs=require('node:fs');const path=require('node:path');const files={"tests/fixtures/copper-pour-definition.ts":"export const copperPourDefinitionRecords = [\n\"|RECORD=Board|VX0=0mil|VY0=0mil|VX1=500mil|VY1=0mil|VX2=500mil|VY2=400mil|VX3=0mil|VY3=400mil|VX4=0mil|VY4=0mil\",\n\"|RECORD=Net|NAME=GND\",\n\"|RECORD=Rule|RULEKIND=Clearance|ENABLED=TRUE|PRIORITY=1|SCOPE1EXPRESSION=All|SCOPE2EXPRESSION=All|GAP=10mil\",\n\"|RECORD=Polygon|ID=7|LAYER=TOP|NET=0|VX0=50mil|VY0=50mil|VX1=450mil|VY1=50mil|VX2=450mil|VY2=350mil|VX3=50mil|VY3=350mil|VX4=50mil|VY4=50mil\",\n\"|RECORD=Region|POLYGON=7|LAYER=TOP|NET=0|REGIONKIND=COPPER|VX0=50mil|VY0=50mil|VX1=200mil|VY1=50mil|VX2=200mil|VY2=350mil|VX3=50mil|VY3=350mil\",\n\"|RECORD=Region|POLYGON=7|LAYER=TOP|NET=0|REGIONKIND=COPPER|VX0=250mil|VY0=50mil|VX1=450mil|VY1=50mil|VX2=450mil|VY2=350mil|VX3=250mil|VY3=350mil|HOLECOUNT=1|HOLE0COUNT=4|HOLE0VX0=350mil|HOLE0VY0=250mil|HOLE0VX1=400mil|HOLE0VY1=250mil|HOLE0VX2=400mil|HOLE0VY2=300mil|HOLE0VX3=350mil|HOLE0VY3=300mil\",\n\"|RECORD=Region|POLYGON=7|LAYER=TOP|REGIONKIND=POLYGON_CUTOUT|VX0=350mil|VY0=250mil|VX1=400mil|VY1=250mil|VX2=400mil|VY2=300mil|VX3=350mil|VY3=300mil\",\n]\n","tests/conversion/pcb-copper-pour-definition-repro.test.ts":"import { expect, test } from \"bun:test\"\nimport { parseAltiumPcbDoc } from \"altiumts\"\nimport { convertCircuitJsonToPcbSvg } from \"circuit-to-svg\"\nimport { stackSvgsHorizontally } from \"stack-svgs\"\nimport { convertAltiumPcbDocToCircuitJson } from \"../../lib\"\nimport { copperPourDefinitionRecords } from \"../fixtures/copper-pour-definition\"\ntest(\"shows cached fill gaps that are not part of the authored pour boundary\", async () => {\n  const authoredDocument = parseAltiumPcbDoc(copperPourDefinitionRecords.filter((record) => !record.includes(\"REGIONKIND=COPPER\")).join(\"\\n\"))\n  const savedDocument = parseAltiumPcbDoc(copperPourDefinitionRecords.join(\"\\n\"))\n  const authored = convertAltiumPcbDocToCircuitJson(authoredDocument)\n  const imported = convertAltiumPcbDocToCircuitJson(savedDocument)\n  expect(authored.filter((element) => element.type === \"pcb_copper_pour\")).toHaveLength(1)\n  expect(imported.filter((element) => element.type === \"pcb_copper_pour\")).toHaveLength(2)\n  const comparison = stackSvgsHorizontally([authored, imported].map((circuitJson) => convertCircuitJsonToPcbSvg(circuitJson, {width:600,height:480,backgroundColor:\"white\",includeVersion:false,showSolderMask:false})), {gap:24,normalizeSize:false,rootAttributes:{\"aria-label\":\"Authored pour boundary on left; imported cached copper with an obsolete routing gap on right\"}})\n  await expect(comparison).toMatchSvgSnapshot(import.meta.path)\n})\n","tests/conversion/pcb-copper-pour-recompute.test.ts":"import { expect, test } from \"bun:test\"\nimport { parseAltiumPcbDoc } from \"altiumts\"\nimport { convertCircuitJsonToPcbSvg } from \"circuit-to-svg\"\nimport { stackSvgsHorizontally } from \"stack-svgs\"\nimport { convertAltiumPcbDocToCircuitJson } from \"../../lib\"\nimport { copperPourDefinitionRecords } from \"../fixtures/copper-pour-definition\"\nimport { hasCopperAt } from \"../helpers/hasCopperAt\"\ntest(\"imports authored pour definitions and global clearance for recomputation\", async () => {\n const document=parseAltiumPcbDoc(copperPourDefinitionRecords.join(\"\\n\"))\n const preserved=convertAltiumPcbDocToCircuitJson(document)\n expect(convertAltiumPcbDocToCircuitJson(document,{copperPourMode:\"preserve\"})).toEqual(preserved)\n const recomputed=convertAltiumPcbDocToCircuitJson(document,{copperPourMode:\"recompute\"})\n const pours=recomputed.filter((element)=>element.type===\"pcb_copper_pour\")\n expect(pours).toHaveLength(1)\n expect(pours[0]).toMatchObject({pcb_copper_pour_id:\"pcb_copper_pour_altium_polygon_0\",source_net_id:expect.any(String),layer:\"top\",shape:\"brep\"})\n expect(hasCopperAt(pours,{x:5.715,y:3.81})).toBe(true)\n expect(hasCopperAt(pours,{x:9.525,y:6.985})).toBe(false)\n expect(recomputed.find((element)=>element.type===\"pcb_board\")).toMatchObject({min_trace_to_pad_edge_clearance:0.254,min_different_net_trace_edge_to_trace_edge_clearance:0.254,min_pad_edge_to_pad_edge_clearance:0.254})\n expect(recomputed.find((element)=>element.type===\"source_net\")).toMatchObject({source_net_id:pours[0]?.source_net_id,name:\"GND\"})\n expect(convertAltiumPcbDocToCircuitJson(document,{copperPourMode:\"recompute\",includeCopperAreas:false}).some((element)=>element.type===\"pcb_copper_pour\")).toBe(false)\n for(const replacement of [\"\",\"|SCOPE1EXPRESSION=InNet('HV')\"]){\n  const records=replacement?copperPourDefinitionRecords.map((record)=>record.replace(\"|SCOPE1EXPRESSION=All\",replacement)):copperPourDefinitionRecords.filter((record)=>!record.includes(\"RULEKIND=Clearance\"))\n  expect(()=>convertAltiumPcbDocToCircuitJson(parseAltiumPcbDoc(records.join(\"\\n\")),{copperPourMode:\"recompute\"})).toThrow(/clearance rule/)\n }\n const comparison=stackSvgsHorizontally([preserved,recomputed].map((circuitJson)=>convertCircuitJsonToPcbSvg(circuitJson,{width:600,height:480,backgroundColor:\"white\",includeVersion:false,showSolderMask:false})),{gap:24,normalizeSize:false})\n await expect(comparison).toMatchSvgSnapshot(import.meta.path)\n})\n","lib/pcb/routing/getCopperPourClearanceConstraints.ts":"import type { AltiumPcbDocument } from \"altiumts\"\nimport { milsToMillimeters } from \"../geometry\"\nimport type { PcbRoutingConstraints } from \"../model\"\nimport { getHighestPriorityGlobalRule } from \"./getHighestPriorityGlobalRule\"\nimport { isAllScope } from \"./isAllScope\"\nexport function getCopperPourClearanceConstraints(document: AltiumPcbDocument): PcbRoutingConstraints[\"pcbBoard\"] {\n const hasScopedClearance=document.rules.some((rule)=>rule.enabled!==false&&rule.ruleKind?.toUpperCase()===\"CLEARANCE\"&&(!isAllScope(rule.scope1Expression)||!isAllScope(rule.scope2Expression)))\n if(hasScopedClearance)throw new Error(\"Copper pour recomputation does not support scoped Altium clearance rules\")\n const clearanceMils=getHighestPriorityGlobalRule({document,ruleKind:\"Clearance\"})?.clearanceMils\n if(clearanceMils===undefined)throw new Error(\"Copper pour recomputation requires a global Altium clearance rule\")\n if(!Number.isFinite(clearanceMils)||clearanceMils<0)throw new Error(\"Altium copper pour clearance must be finite and nonnegative\")\n const boardEdgeClearanceMils=getHighestPriorityGlobalRule({document,ruleKind:\"BoardOutlineClearance\"})?.clearanceMils\n const clearanceMillimeters=milsToMillimeters(clearanceMils)\n return {...(boardEdgeClearanceMils===undefined?{}:{min_board_edge_clearance:milsToMillimeters(boardEdgeClearanceMils)}),min_trace_to_pad_edge_clearance:clearanceMillimeters,min_different_net_trace_edge_to_trace_edge_clearance:clearanceMillimeters,min_pad_edge_to_pad_edge_clearance:clearanceMillimeters}\n}\n","lib/pcb/model/types.ts":"import type {\n  AltiumEmbeddedModel,\n  AltiumPadRecord,\n  AltiumPcbDocument,\n  AltiumPrjPcb,\n  AltiumRecord,\n} from \"altiumts\"\nimport type {\n  AnyCircuitElement,\n  PcbBoard,\n  SourceNet,\n  SourcePort,\n  SourceSimpleChip,\n  SourceTrace,\n} from \"circuit-json\"\nimport type { PcbCopperLayerMap } from \"../layers\"\n\nexport interface EmbeddedModelUrlContext {\n  embeddedModel: AltiumEmbeddedModel\n}\n\nexport interface ConvertAltiumPcbDocOptions {\n  idPrefix?: string\n  includeBoardOutline?: boolean\n  includeCadModels?: boolean\n  includeComponents?: boolean\n  includeCopperAreas?: boolean\n  /** Import authored polygon boundaries instead of saved fills for repouring. */\n  copperPourMode?: \"preserve\" | \"recompute\"\n  includeCourtyards?: boolean\n  includeDimensions?: boolean\n  includeKeepouts?: boolean\n  includePads?: boolean\n  includeSilkscreen?: boolean\n  includeTraces?: boolean\n  includeVias?: boolean\n  resolveEmbeddedModelUrl?: (\n    context: EmbeddedModelUrlContext,\n  ) => string | undefined\n  project?: AltiumPrjPcb\n}\n\nexport interface PcbNetContext {\n  elements: Array<SourceNet | SourceTrace>\n  getSourceNetId: (record: AltiumRecord) => string | undefined\n  getSourceTraceId: (record: AltiumRecord) => string | undefined\n}\n\nexport interface PcbComponentContext {\n  sourceComponents: SourceSimpleChip[]\n  sourcePorts: SourcePort[]\n  getPcbComponentId: (record: AltiumRecord) => string | undefined\n  getSourcePortId: (record: AltiumPadRecord) => string | undefined\n}\n\nexport interface PcbRoutingConstraints {\n  pcbBoard: Pick<\n    PcbBoard,\n    | \"allow_blind_and_buried_vias\"\n    | \"is_via_in_pad_allowed\"\n    | \"min_trace_width\"\n    | \"min_board_edge_clearance\"\n    | \"min_trace_to_pad_edge_clearance\"\n    | \"min_different_net_trace_edge_to_trace_edge_clearance\"\n    | \"min_pad_edge_to_pad_edge_clearance\"\n    | \"min_via_hole_diameter\"\n    | \"min_via_pad_diameter\"\n  >\n  sourceNetTraceWidthMillimeters?: number\n}\n\nexport interface PcbConversionContext {\n  componentContext: PcbComponentContext\n  document: AltiumPcbDocument\n  elements: AnyCircuitElement[]\n  layerMap: PcbCopperLayerMap\n  netContext: PcbNetContext\n  options: ConvertAltiumPcbDocOptions\n  routingConstraints: PcbRoutingConstraints\n}\n","lib/pcb/copperAreas/convertAltiumCopperAreas.ts":"import {\n  AltiumFillRecord,\n  type AltiumPcbDocument,\n  AltiumPolygonRecord,\n  type AltiumRecord,\n  AltiumRegionRecord,\n  getPcbContour,\n  getPcbRecordPolygonIndex,\n  getPcbRegionGeometry,\n} from \"altiumts\"\nimport type { PcbCopperPour } from \"circuit-json\"\nimport { PcbCopperLayerMap } from \"../layers\"\nimport { convertCopperFill } from \"./convertCopperFill\"\nimport { convertCopperPolygon } from \"./convertCopperPolygon\"\nimport { convertCopperRegion } from \"./convertCopperRegion\"\nimport { isContourInsideContour } from \"./isContourInsideContour\"\n\nexport function convertAltiumCopperAreas(\n  document: AltiumPcbDocument,\n  {\n    layerMap = new PcbCopperLayerMap(document),\n    getSourceNetId = () => undefined,\n    copperPourMode = \"preserve\",\n  }: {\n    layerMap?: PcbCopperLayerMap\n    copperPourMode?: \"preserve\" | \"recompute\"\n    getSourceNetId?: (record: AltiumRecord) => string | undefined\n  } = {},\n): PcbCopperPour[] {\n  const polygonsWithCopperRegions = new Set<AltiumPolygonRecord>()\n  const cutoutsByPolygon = new Map<AltiumPolygonRecord, AltiumRegionRecord[]>()\n  const polygonContours = new Map<\n    AltiumPolygonRecord,\n    ReturnType<typeof getPcbContour>\n  >()\n  for (const record of document.records) {\n    if (\n      !(record instanceof AltiumRegionRecord) ||\n      record.recordKind !== \"Region\"\n    ) {\n      continue\n    }\n    const polygonIndex = getPcbRecordPolygonIndex(document, record)\n    const linkedPolygon = document.getPolygonForRecord(record)\n    if (record.regionKind === \"COPPER\") {\n      if (record.getBoolean(\"KEEPOUT\") === true) continue\n      if (linkedPolygon) polygonsWithCopperRegions.add(linkedPolygon)\n    } else if (record.regionKind === \"POLYGON_CUTOUT\") {\n      const cutoutGeometry = getPcbRegionGeometry(record)\n      const candidatePolygons =\n        polygonIndex === undefined\n          ? document.polygons\n          : linkedPolygon\n            ? [linkedPolygon]\n            : []\n      const polygons = candidatePolygons.filter((polygon) => {\n        if (record.layer !== polygon.layer && record.layer !== \"MULTILAYER\") {\n          return false\n        }\n        let polygonContour = polygonContours.get(polygon)\n        if (!polygonContour) {\n          polygonContour = getPcbContour(polygon)\n          polygonContours.set(polygon, polygonContour)\n        }\n        return isContourInsideContour({\n          innerContour: cutoutGeometry.outline,\n          outerContour: polygonContour,\n        })\n      })\n      for (const polygon of polygons) {\n        const cutouts = cutoutsByPolygon.get(polygon) ?? []\n        cutouts.push(record)\n        cutoutsByPolygon.set(polygon, cutouts)\n      }\n    }\n  }\n  const polygonIndexes = new Map(\n    document.polygons.map((polygon, index) => [polygon, index]),\n  )\n\n  return document.records.flatMap((record, recordIndex) => {\n    if (record.getBoolean(\"KEEPOUT\") === true) return []\n    if (record instanceof AltiumRegionRecord) {\n      if (copperPourMode === \"recompute\") return []\n      return convertCopperRegion({\n        layerMap,\n        record,\n        recordIndex,\n        sourceNetId: getSourceNetId(record),\n      })\n    }\n    if (record instanceof AltiumPolygonRecord) {\n      const polygonIndex = polygonIndexes.get(record)\n      if (\n        record.shelved === true ||\n        polygonIndex === undefined ||\n        (copperPourMode === \"preserve\" && polygonsWithCopperRegions.has(record))\n      ) {\n        return []\n      }\n      return convertCopperPolygon({\n        cutouts: cutoutsByPolygon.get(record) ?? [],\n        layerMap,\n        polygonIndex,\n        record,\n        sourceNetId: getSourceNetId(record),\n      })\n    }\n    if (record instanceof AltiumFillRecord) {\n      if (copperPourMode === \"recompute\") return []\n      return convertCopperFill({\n        layerMap,\n        record,\n        recordIndex,\n        sourceNetId: getSourceNetId(record),\n      })\n    }\n    return []\n  })\n}\n","lib/pcb/copperAreas/convertPcbCopperAreas.ts":"import type { PcbConversionContext } from \"../model\"\nimport { convertAltiumCopperAreas } from \"./convertAltiumCopperAreas\"\n\nexport function convertPcbCopperAreas(context: PcbConversionContext): void {\n  if (context.options.includeCopperAreas === false) return\n  context.elements.push(\n    ...convertAltiumCopperAreas(context.document, {\n      layerMap: context.layerMap,\n      copperPourMode: context.options.copperPourMode,\n      getSourceNetId: context.netContext.getSourceNetId,\n    }),\n  )\n}\n","lib/pcb/context/createPcbConversionContext.ts":"import type { AltiumPcbDocument } from \"altiumts\"\nimport { PcbCopperLayerMap } from \"../layers\"\nimport type { ConvertAltiumPcbDocOptions, PcbConversionContext } from \"../model\"\nimport { getPcbRoutingConstraints } from \"../routing/getPcbRoutingConstraints\"\nimport { createPcbComponentContext } from \"./createPcbComponentContext\"\nimport { createPcbNetContext } from \"./createPcbNetContext\"\n\nexport function createPcbConversionContext({\n  document,\n  options,\n}: {\n  document: AltiumPcbDocument\n  options: ConvertAltiumPcbDocOptions\n}): PcbConversionContext {\n  const layerMap = new PcbCopperLayerMap(document)\n  const componentContext = createPcbComponentContext({\n    document,\n    includePorts: options.includePads !== false,\n    layerMap,\n  })\n  const routingConstraints = getPcbRoutingConstraints({\n    document,\n    layerMap,\n    copperPourMode: options.includeCopperAreas === false ? \"preserve\" : options.copperPourMode,\n  })\n  return {\n    componentContext,\n    document,\n    elements: [],\n    layerMap,\n    netContext: createPcbNetContext({\n      componentContext,\n      document,\n      sourceNetTraceWidthMillimeters:\n        routingConstraints.sourceNetTraceWidthMillimeters,\n    }),\n    options,\n    routingConstraints,\n  }\n}\n","lib/pcb/routing/getPcbRoutingConstraints.ts":"import { type AltiumPcbDocument, AltiumViaRecord } from \"altiumts\"\nimport { milsToMillimeters } from \"../geometry\"\nimport type { PcbCopperLayerMap } from \"../layers\"\nimport type { PcbRoutingConstraints } from \"../model\"\nimport { getHighestPriorityGlobalRule } from \"./getHighestPriorityGlobalRule\"\nimport { getCopperPourClearanceConstraints } from \"./getCopperPourClearanceConstraints\"\nimport { usesViaInPad } from \"./usesViaInPad\"\n\nexport function getPcbRoutingConstraints({\n  document,\n  layerMap,\n  copperPourMode,\n}: {\n  document: AltiumPcbDocument\n  layerMap: PcbCopperLayerMap\n  copperPourMode?: \"preserve\" | \"recompute\"\n}): PcbRoutingConstraints {\n  const widthRule = getHighestPriorityGlobalRule({\n    document,\n    ruleKind: \"Width\",\n  })\n  const routingViasRule = getHighestPriorityGlobalRule({\n    document,\n    ruleKind: \"RoutingVias\",\n  })\n  const minimumTraceWidthMils = widthRule?.widthConstraint?.minimumMils\n  const preferredTraceWidthMils = widthRule?.widthConstraint?.preferredMils\n  const minimumViaHoleDiameterMils =\n    routingViasRule?.viaHoleConstraint?.minimumMils\n  const minimumViaPadDiameterMils =\n    routingViasRule?.viaDiameterConstraint?.minimumMils\n  const pcbBoard: PcbRoutingConstraints[\"pcbBoard\"] =\n    copperPourMode === \"recompute\" && document.polygons.length > 0\n      ? getCopperPourClearanceConstraints(document)\n      : {}\n  const routingConstraints: PcbRoutingConstraints = { pcbBoard }\n\n  const hasBlindOrBuriedVia = document.records.some(\n    (record) =>\n      record instanceof AltiumViaRecord && record.kind === \"blind-buried\",\n  )\n  if (hasBlindOrBuriedVia) {\n    pcbBoard.allow_blind_and_buried_vias = true\n  }\n\n  if (usesViaInPad({ document, layerMap })) {\n    pcbBoard.is_via_in_pad_allowed = true\n  }\n\n  if (minimumTraceWidthMils !== undefined) {\n    pcbBoard.min_trace_width = milsToMillimeters(minimumTraceWidthMils)\n  }\n\n  if (minimumViaHoleDiameterMils !== undefined) {\n    pcbBoard.min_via_hole_diameter = milsToMillimeters(\n      minimumViaHoleDiameterMils,\n    )\n  }\n\n  if (minimumViaPadDiameterMils !== undefined) {\n    pcbBoard.min_via_pad_diameter = milsToMillimeters(minimumViaPadDiameterMils)\n  }\n\n  if (preferredTraceWidthMils !== undefined) {\n    routingConstraints.sourceNetTraceWidthMillimeters = milsToMillimeters(\n      preferredTraceWidthMils,\n    )\n  }\n\n  return routingConstraints\n}\n"};for(const [name,content]of Object.entries(files)){fs.mkdirSync(path.dirname(name),{recursive:true});fs.writeFileSync(name,content)}
          NODE
      - name: Match repository formatting
        run: bunx biome format --write tests/fixtures/copper-pour-definition.ts tests/conversion/pcb-copper-pour-definition-repro.test.ts tests/conversion/pcb-copper-pour-recompute.test.ts lib/pcb/routing/getCopperPourClearanceConstraints.ts lib/pcb/model/types.ts lib/pcb/copperAreas/convertAltiumCopperAreas.ts lib/pcb/copperAreas/convertPcbCopperAreas.ts lib/pcb/context/createPcbConversionContext.ts lib/pcb/routing/getPcbRoutingConstraints.ts
      - name: Generate repro and fix snapshots
        run: BUN_UPDATE_SNAPSHOTS=1 bun test tests/conversion/pcb-copper-pour-definition-repro.test.ts tests/conversion/pcb-copper-pour-recompute.test.ts --timeout 9999999
      - name: Verify existing copper imports and handbook
        run: bun test tests/conversion/pcb-copper-areas.test.ts tests/conversion/pcb-polygon-cutout.test.ts tests/conversion/pcb-polygon-deduplication.test.ts tests/conversion/pcb-keepout-regions-not-copper.test.ts tests/architecture/handbookCompliance.test.ts --timeout 9999999
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Return source and generated SVGs
        if: always()
        run: |
          node <<'NODE'
          const fs=require('node:fs');const {Resvg}=require('@resvg/resvg-js');const names=["tests/fixtures/copper-pour-definition.ts","tests/conversion/pcb-copper-pour-definition-repro.test.ts","tests/conversion/__snapshots__/pcb-copper-pour-definition-repro.snap.svg","lib/pcb/model/types.ts","lib/pcb/copperAreas/convertAltiumCopperAreas.ts","lib/pcb/copperAreas/convertPcbCopperAreas.ts","lib/pcb/context/createPcbConversionContext.ts","lib/pcb/routing/getPcbRoutingConstraints.ts","lib/pcb/routing/getCopperPourClearanceConstraints.ts","tests/conversion/pcb-copper-pour-recompute.test.ts","tests/conversion/__snapshots__/pcb-copper-pour-recompute.snap.svg"];for(const name of names){if(fs.existsSync(name)){console.log('POUR_ARTIFACT '+name+' '+fs.readFileSync(name).toString('base64'));if(name.endsWith('.svg'))console.log('POUR_PREVIEW '+name+' '+new Resvg(fs.readFileSync(name,'utf8'),{fitTo:{mode:'width',value:1600}}).render().asPng().toString('base64'))}}
          NODE

name: Verify PR 239 with standard test settings
on:
  push:
    branches: [codex/pour-definition-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5aee3840e2b309b9e4474ec18f50cf2c08d3b81
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run download-references
      - name: Run the standard full suite without updating snapshots
        run: bun test
      - run: bun run format:check
      - run: bunx tsc --noEmit
      - run: bun run build

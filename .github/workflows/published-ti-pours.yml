name: Run published converters on TI power boards
on:
  push:
    branches: [codex/pour-published-ti-run]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0bbc941392622667b66fcd5bb6cea4dee8382229
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run download-references
      - name: Prepare isolated npm consumer
        run: |
          node <<'NODE'
          const fs=require('node:fs');const files={"package.json":"{\n  \"name\": \"ti-power-fresh-pours\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"dependencies\": {\n    \"altium-to-circuit-json\": \"0.0.116\",\n    \"altiumts\": \"0.0.95\",\n    \"circuit-json-to-tscircuit\": \"0.0.100\",\n    \"tscircuit\": \"0.0.3062\",\n    \"@tscircuit/core\": \"0.0.2259\",\n    \"circuit-to-svg\": \"0.0.454\",\n    \"stack-svgs\": \"0.0.1\",\n    \"typescript\": \"5.9.3\"\n  }\n}\n","preflight.ts":"import assert from \"node:assert/strict\"\nimport { mkdir } from \"node:fs/promises\"\nimport { parseAltiumBinaryPcbDoc } from \"altiumts\"\nimport { convertAltiumPcbDocToCircuitJson } from \"altium-to-circuit-json\"\nimport { convertCircuitJsonToTscircuit } from \"circuit-json-to-tscircuit\"\nimport { runTscircuitCode } from \"tscircuit\"\nimport { convertCircuitJsonToPcbSvg } from \"circuit-to-svg\"\n\nawait mkdir(\"results\",{recursive:true})\nconst versions={}\nfor(const name of [\"altium-to-circuit-json\",\"circuit-json-to-tscircuit\",\"tscircuit\",\"@tscircuit/core\"]){\n  const packageJson=await Bun.file(\"node_modules/\"+name+\"/package.json\").json()\n  versions[name]={version:packageJson.version,entry:import.meta.resolve(name)}\n}\nassert.equal(versions[\"altium-to-circuit-json\"].version,\"0.0.116\")\nassert.equal(versions[\"circuit-json-to-tscircuit\"].version,\"0.0.100\")\nconsole.log(\"PUBLISHED_VERSIONS \"+JSON.stringify(versions))\nawait import(\"./control\")\n\nconst report={versions,control:\"passed\",boards:[]}\nconst boards=[{\"sample\":21,\"name\":\"PMP23595\",\"filename\":\"ti-pmp23595.PcbDoc\"},{\"sample\":22,\"name\":\"PMP23653 main\",\"filename\":\"ti-pmp23653-main.PcbDoc\"},{\"sample\":23,\"name\":\"PMP23653 planar transformer\",\"filename\":\"ti-pmp23653-planar-transformer.PcbDoc\"},{\"sample\":24,\"name\":\"PMP22650\",\"filename\":\"ti-pmp22650-main.PcbDoc\"},{\"sample\":25,\"name\":\"PMP22712\",\"filename\":\"ti-pmp22712.PcbDoc\"},{\"sample\":26,\"name\":\"PMP22773\",\"filename\":\"ti-pmp22773.PcbDoc\"}]\n// Start with the smallest TI power board if conversion supports its rules.\nfor(const board of [boards[4],boards[5],boards[0],boards[1],boards[3],boards[2]]){\n const started=performance.now()\n const source=new Uint8Array(await Bun.file(\"../tests/fixtures/downloaded/\"+board.filename).arrayBuffer())\n const document=parseAltiumBinaryPcbDoc(source)\n const clearanceRules=document.rules.filter(r=>r.enabled!==false&&r.ruleKind?.toUpperCase()===\"CLEARANCE\").map(r=>({name:r.getString(\"NAME\"),priority:r.priority,scope1:r.scope1Expression,scope2:r.scope2Expression,clearanceMils:r.clearanceMils}))\n const result={...board,sourceBytes:source.length,polygonCount:document.polygons.length,clearanceRules}\n let stage=\"altium-conversion\"\n try{\n  const input=convertAltiumPcbDocToCircuitJson(document,{\n   copperPourMode:\"recompute\",includeTraces:false,includeVias:false,includeCadModels:false,\n  })\n  assert(!input.some(e=>e.type===\"pcb_trace\"||e.type===\"pcb_via\"))\n  result.inputPours=input.filter(e=>e.type===\"pcb_copper_pour\").length\n  result.inputPorts=input.filter(e=>e.type===\"pcb_port\").length\n  await Bun.write(\"results/sample\"+board.sample+\".input.circuit.json\",JSON.stringify(input))\n  stage=\"tsx-conversion\"\n  const tsx=convertCircuitJsonToTscircuit(input,{componentName:\"ImportedBoard\",copperPourMode:\"recompute\"})\n  await Bun.write(\"results/sample\"+board.sample+\".tsx\",tsx)\n  stage=\"core-render\"\n  const output=await runTscircuitCode(tsx)\n  result.traceCount=output.filter(e=>e.type===\"pcb_trace\").length\n  result.pourCount=output.filter(e=>e.type===\"pcb_copper_pour\").length\n  const errors=output.filter(e=>e.type.endsWith(\"_error\"))\n  result.errors=Object.fromEntries([...new Set(errors.map(e=>e.type))].map(type=>[type,errors.filter(e=>e.type===type).length]))\n  result.status=errors.length?\"has_errors\":\"rendered\"\n  await Bun.write(\"results/sample\"+board.sample+\".output.circuit.json\",JSON.stringify(output))\n  await Bun.write(\"results/sample\"+board.sample+\".svg\",convertCircuitJsonToPcbSvg(output,{width:1600,height:1200,includeVersion:false,showSolderMask:false,shouldDrawRatsNest:false,backgroundColor:\"white\"}))\n }catch(error){\n  result.status=\"blocked\"\n  result.stage=stage\n  result.error=String(error)\n }\n result.elapsedMs=Math.round(performance.now()-started)\n report.boards.push(result)\n console.log(\"TI_BOARD_RESULT \"+JSON.stringify(result))\n}\nreport.boards.sort((a,b)=>a.sample-b.sample)\nawait Bun.write(\"results/report.json\",JSON.stringify(report,null,2))\nconsole.log(\"TI_PUBLISHED_REPORT \"+JSON.stringify(report))\n","control.ts":"import assert from \"node:assert/strict\"\nimport { parseAltiumPcbDoc } from \"altiumts\"\nimport { convertAltiumPcbDocToCircuitJson } from \"altium-to-circuit-json\"\nimport { copperPourDefinitionRecords } from \"../tests/fixtures/copper-pour-definition\"\nimport { convertCircuitJsonToTscircuit } from \"circuit-json-to-tscircuit\"\nimport { hasCopperPourAt } from \"./geometry\"\nimport { runTscircuitCode } from \"tscircuit\"\nimport { convertCircuitJsonToPcbSvg } from \"circuit-to-svg\"\nimport { stackSvgsHorizontally } from \"stack-svgs\"\n\nconst document = parseAltiumPcbDoc([\n  ...copperPourDefinitionRecords,\n  \"|RECORD=Net|NAME=SIGNAL\",\n  \"|RECORD=Component|ID=0|LAYER=TOP|X=100mil|Y=200mil|SOURCEDESIGNATOR=A\",\n  \"|RECORD=Component|ID=1|LAYER=TOP|X=400mil|Y=200mil|SOURCEDESIGNATOR=B\",\n  \"|RECORD=Component|ID=2|LAYER=TOP|X=100mil|Y=100mil|SOURCEDESIGNATOR=G\",\n  \"|RECORD=Pad|NAME=1|COMPONENT=0|NET=1|LAYER=TOP|X=100mil|Y=200mil|XSIZE=20mil|YSIZE=20mil|SHAPE=RECTANGLE\",\n  \"|RECORD=Pad|NAME=1|COMPONENT=1|NET=1|LAYER=TOP|X=400mil|Y=200mil|XSIZE=20mil|YSIZE=20mil|SHAPE=RECTANGLE\",\n  \"|RECORD=Pad|NAME=1|COMPONENT=2|NET=0|LAYER=TOP|X=100mil|Y=100mil|XSIZE=20mil|YSIZE=20mil|SHAPE=RECTANGLE\",\n].join(\"\\n\"))\nconst definitions = convertAltiumPcbDocToCircuitJson(document, {\n  copperPourMode: \"recompute\", includeTraces: false, includeVias: false,\n})\nassert.equal(definitions.some(e=>e.type===\"pcb_trace\"),false)\nassert.equal(definitions.filter(e=>e.type===\"pcb_copper_pour\").length,1)\nconst tsx = convertCircuitJsonToTscircuit(definitions, {\n  componentName: \"ImportedBoard\", copperPourMode: \"recompute\",\n})\nconst rendered = await runTscircuitCode(tsx)\nassert(rendered.some(e=>e.type===\"pcb_trace\"),\"Core must create fresh routing\")\nassert(hasCopperPourAt(rendered,{x:5.715,y:3.81}),\"Old cached routing gap must be filled\")\nassert(!hasCopperPourAt(rendered,{x:5.715,y:5.28}),\"Copper must clear the newly routed trace\")\nassert(!hasCopperPourAt(rendered,{x:9.525,y:6.985}),\"Authored cutout must remain empty\")\nassert(hasCopperPourAt(rendered,{x:4,y:4}),\"Non-obstructed copper must remain\")\nconst ground=rendered.find(e=>e.type===\"source_net\"&&e.name===\"GND\")\nassert(ground?.type===\"source_net\")\nassert(rendered.filter(e=>e.type===\"pcb_copper_pour\").every(e=>e.source_net_id===ground.source_net_id))\nconst metrics={inputPours:definitions.filter(e=>e.type===\"pcb_copper_pour\").length,outputPours:rendered.filter(e=>e.type===\"pcb_copper_pour\").length,freshTraces:rendered.filter(e=>e.type===\"pcb_trace\").length,traceMargin:0.254,oldGapFilled:true,newTraceCleared:true,authoredCutoutPreserved:true}\nconsole.log(JSON.stringify(metrics))\nawait Bun.write(\"results/control.json\",JSON.stringify(metrics,null,2))\nawait Bun.write(\"results/control.svg\",stackSvgsHorizontally([definitions,rendered].map(c=>convertCircuitJsonToPcbSvg(c,{width:600,height:480,backgroundColor:\"white\",showSolderMask:false,includeVersion:false,shouldDrawRatsNest:false})),{gap:24,normalizeSize:false}))\n","geometry.ts":"import type { CircuitJson, Point } from \"circuit-json\"\nexport function hasCopperPourAt(\n  circuitJson: CircuitJson,\n  point: Point,\n): boolean {\n  return circuitJson.some(\n    (element) =>\n      element.type === \"pcb_copper_pour\" &&\n      element.shape === \"brep\" &&\n      isPointInsideRing(element.brep_shape.outer_ring.vertices, point) &&\n      !element.brep_shape.inner_rings.some((ring) =>\n        isPointInsideRing(ring.vertices, point),\n      ),\n  )\n}\n\nfunction isPointInsideRing(vertices: Point[], point: Point): boolean {\n  let inside = false\n  for (let i = 0, j = vertices.length - 1; i < vertices.length; j = i++) {\n    const a = vertices[i]!\n    const b = vertices[j]!\n    if (\n      a.y > point.y !== b.y > point.y &&\n      point.x < ((b.x - a.x) * (point.y - a.y)) / (b.y - a.y) + a.x\n    ) {\n      inside = !inside\n    }\n  }\n  return inside\n}\n"};fs.mkdirSync('published-run',{recursive:true});for(const [name,content]of Object.entries(files))fs.writeFileSync('published-run/'+name,content)
          NODE
      - run: bun install
        working-directory: published-run
      - name: Run fresh routing and pouring with published packages
        run: bun run preflight.ts
        working-directory: published-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ti-published-pour-results
          path: |
            published-run/results
            published-run/bun.lock

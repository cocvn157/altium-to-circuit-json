name: Verify original TI copper rules
on:
  push:
    branches: [codex/scoped-copper-native-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install
      - name: Report generated lockfile
        run: node -e 'console.log("SCOPED_LOCK "+require("node:zlib").gzipSync(require("node:fs").readFileSync("bun.lock")).toString("base64"))'
      - run: bun run build
      - run: bun run typecheck
      - uses: actions/cache@v4
        with:
          path: tests/fixtures/downloaded
          key: altium-references-${{ runner.os }}-${{ hashFiles('scripts/references/reference-manifest.ts') }}
      - run: bun run download-references
      - run: bun run scripts/scoped-native-check.ts

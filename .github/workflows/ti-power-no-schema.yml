name: TI power boards without schema changes
on:
  push:
    branches: [codex/ti-power-no-schema-demo]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        sample: [21, 22, 23, 24, 25, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/circuit-json-to-tscircuit
          ref: 2fd12a596b10acc99a1da87a0dd8d1221ddf0853
          path: runtime-converter
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/copper-pour-solver
          ref: 2544af541c3819186f16912f3e9a20e4ef185d93
          path: scripts/ti-power-adapter/solver-base
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: runtime-converter
      - uses: actions/cache@v4
        with:
          path: tests/fixtures/downloaded
          key: altium-references-${{ runner.os }}-${{ hashFiles('scripts/references/reference-manifest.ts') }}
      - run: bun run download-references
      - run: bun install
        working-directory: scripts/ti-power-adapter
      - run: bun run prepare-solver.ts && bun test ./tests/*.test.ts
        working-directory: scripts/ti-power-adapter
      - name: Route through core and compute fresh copper
        working-directory: scripts/ti-power-adapter
        env:
          TI_SAMPLE: ${{ matrix.sample }}
          TI_ROUTE: "1"
        run: bun run run-native.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ti-power-no-schema-${{ matrix.sample }}
          path: scripts/ti-power-adapter/results
          retention-days: 7
